name: Build BabyFileCab for Linux

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out BabyFileCab
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0 libx11-6 libxext6 libxrender1 libsm6

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install BabyFileCab dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check required imports
        run: |
          python -c "import tkinter; print('Tkinter OK:', tkinter.TkVersion)"
          python -c "import pypdfium2, pypdf, PIL, openpyxl, reportlab, docx, cryptography, argon2; print('BabyFileCab dependencies OK')"

      - name: Check BabyFileCab syntax
        run: python -m py_compile babyfilecab.py

      - name: Build BabyFileCab for Linux
        run: |
          python -m PyInstaller             --noconfirm             --clean             --windowed             --onedir             --name BabyFileCab             --collect-all pypdfium2             babyfilecab.py

      - name: Create AppDir
        run: |
          mkdir -p BabyFileCab.AppDir/usr/bin
          mkdir -p BabyFileCab.AppDir/usr/share/applications
          mkdir -p BabyFileCab.AppDir/usr/share/icons/hicolor/256x256/apps

          cp -R dist/BabyFileCab/* BabyFileCab.AppDir/usr/bin/
          cp assets/BabyFileCab.png BabyFileCab.AppDir/usr/share/icons/hicolor/256x256/apps/babyfilecab.png
          cp assets/BabyFileCab.png BabyFileCab.AppDir/babyfilecab.png

          cat > BabyFileCab.AppDir/BabyFileCab.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BabyFileCab
          Comment=Document Management System for tax preparers and accountants
          Exec=BabyFileCab
          Icon=babyfilecab
          Terminal=false
          Categories=Office;
          EOF

          cp BabyFileCab.AppDir/BabyFileCab.desktop BabyFileCab.AppDir/usr/share/applications/BabyFileCab.desktop

          cat > BabyFileCab.AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/BabyFileCab" "$@"
          EOF

          chmod +x BabyFileCab.AppDir/AppRun
          chmod +x BabyFileCab.AppDir/usr/bin/BabyFileCab

      - name: Download appimagetool
        run: |
          curl -L https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool

      - name: Create AppImage
        env:
          ARCH: x86_64
        run: |
          ./appimagetool --appimage-extract-and-run BabyFileCab.AppDir BabyFileCab-Linux-x86_64.AppImage

      - name: Verify Linux package
        run: |
          ls -lh BabyFileCab-Linux-x86_64.AppImage
          file BabyFileCab-Linux-x86_64.AppImage
          sha256sum BabyFileCab-Linux-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: BabyFileCab-Linux-x86_64
          path: BabyFileCab-Linux-x86_64.AppImage
          if-no-files-found: error

name: Build BabyFileCab for Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Check out BabyFileCab
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install BabyFileCab dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check BabyFileCab syntax
        run: python -m py_compile babyfilecab.py

      - name: Build BabyFileCab.exe
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --name BabyFileCab
          --icon assets\BabyFileCab.ico
          --collect-all pypdfium2
          babyfilecab.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build BabyFileCab installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem `
            "C:\Program Files*\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe was not found."
          }

          & $iscc.FullName "installer\BabyFileCab.iss"

      - name: Upload BabyFileCab installer
        uses: actions/upload-artifact@v7
        with:
          name: BabyFileCab-Windows-Installer
          path: installer/output/BabyFileCab-Setup-v1.0.0.exe
